name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pester y PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 200 | Write-Host
            exit 1
          }
      - name: Pester
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/Invoke-Tests.ps1
      - name: markdownlint
        shell: powershell
        run: npx markdownlint-cli2 "**/*.md" "#docs/superpowers" "#.superpowers" "#node_modules"
